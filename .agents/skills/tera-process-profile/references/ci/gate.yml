# The CI workflow that runs the gate. It is written to
# .github/workflows/gate.yml.
#
# It runs the same command as the profile's `## Gate`, `sh scripts/gate.sh`,
# on every push to the default branch, and proves what merged. It is never a
# pull-request check: before a merge, the check is the gate the session runs
# on its rebased branch, and a pull-request run would gate the same tree a
# second time and make every merge wait for it. Do not add a `pull_request`
# trigger, and do not make this job a required check.
#
# It runs the gate without `--base`, so every merge is tested whole. That is
# what lets a session merge after a green gate without rebasing or gating
# again: what the merge brought together is tested here, after the merge, and
# a red here is fixed like any red on the default branch.
#
# Each toolchain step runs only where the repository has that language's
# manifest, so the file needs no editing for a single-language repository.
# Delete the steps for languages the repository will never use. Rename
# `main` if the default branch is named otherwise.
name: gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes nothing: every merge is proved on its own.
concurrency:
  group: gate-${{ github.sha }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Rust
        if: hashFiles('Cargo.toml') != ''
        run: rustup component add rustfmt clippy

      - name: Set up Python
        if: hashFiles('pyproject.toml', 'requirements*.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        if: hashFiles('pyproject.toml', 'requirements*.txt') != ''
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then python -m pip install -e .; fi

      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # A global.json pins the SDK the repository builds with; without one,
      # the current long-term-support band.
      - name: Set up .NET from global.json
        if: hashFiles('global.json') != ''
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up .NET
        if: hashFiles('global.json') == '' && hashFiles('*.sln', '*.slnx', '**/*.csproj', '**/*.fsproj', '**/*.vbproj') != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Gate
        run: sh scripts/gate.sh
